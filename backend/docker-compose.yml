# Docker Compose for Local Development
# PostgreSQL, Redis, and optional services
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: realinbox_postgres
    environment:
      POSTGRES_USER: realinbox_user
      POSTGRES_PASSWORD: realinbox_password
      POSTGRES_DB: realinbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realinbox_user"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: realinbox_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Celery Worker (for background tasks)
  # celery_worker:
  #   build: .
  #   container_name: realinbox_celery
  #   command: celery -A app.celery_app worker --loglevel=info
  #   depends_on:
  #     - redis
  #     - postgres
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/0
  #     - DATABASE_URL=postgresql://realinbox_user:realinbox_password@postgres:5432/realinbox_db
  #   volumes:
  #     - ./app:/app/app

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: realinbox_network

