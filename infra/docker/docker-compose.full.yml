# Full-Stack Docker Compose for RealInbox AI
# Phase 5.1: Complete multi-service orchestration
# Usage: docker-compose -f infra/docker/docker-compose.full.yml up

version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    container_name: realinbox_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://realinbox:${DB_PASSWORD:-realinbox_pass}@postgres:5432/realinbox_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-True}
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend/app:/app/app
    networks:
      - realinbox_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React App
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../infra/docker/Dockerfile.frontend
    container_name: realinbox_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - realinbox_network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: realinbox_postgres
    environment:
      POSTGRES_USER: realinbox
      POSTGRES_PASSWORD: ${DB_PASSWORD:-realinbox_pass}
      POSTGRES_DB: realinbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - realinbox_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realinbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: realinbox_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    networks:
      - realinbox_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker (Background Tasks)
  celery_worker:
    build:
      context: ../../backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    container_name: realinbox_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://realinbox:${DB_PASSWORD:-realinbox_pass}@postgres:5432/realinbox_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend/app:/app/app
    networks:
      - realinbox_network
    restart: unless-stopped

  # Celery Beat (Periodic Tasks Scheduler)
  celery_beat:
    build:
      context: ../../backend
      dockerfile: ../../infra/docker/Dockerfile.backend
    container_name: realinbox_celery_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ../../backend/.env
    depends_on:
      - redis
    volumes:
      - ../../backend/app:/app/app
    networks:
      - realinbox_network
    restart: unless-stopped

  # Prometheus (Metrics & Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: realinbox_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - realinbox_network
    restart: unless-stopped

  # Grafana (Metrics Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: realinbox_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - realinbox_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  realinbox_network:
    driver: bridge
    name: realinbox_network

# Usage:
# docker-compose -f infra/docker/docker-compose.full.yml up -d
# docker-compose -f infra/docker/docker-compose.full.yml logs -f backend
# docker-compose -f infra/docker/docker-compose.full.yml down

# Access:
# - Backend API: http://localhost:8000
# - Frontend: http://localhost:3000
# - API Docs: http://localhost:8000/api/v1/docs
# - Prometheus: http://localhost:9090
# - Grafana: http://localhost:3001

